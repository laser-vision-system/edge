[package]
name = "edge"
version = "0.1.0"
edition = "2024"

[dependencies]
lab = "0.11"
rayon = "1.12"

[dependencies.nokhwa]
version = "0.10"
default-features = false
features = ["input-native", "output-threaded"]

[dependencies.image]
version = "0.25"
default-features = false
features = ["rayon", "jpeg", "png"]

[dev-dependencies.rerun]
version = "0.33"
features = ["image"]
