name: Rust Lint

on:
  push:
    branches:
    - main
    - dev
    - feat/*
    - bugfix/*
    - rework/*
    - refactor/*
    - temp/*
  pull_request:
    branches:
    - main
    - dev
    - feat/*
    - bugfix/*
    - rework/*
    - refactor/*
    - temp/*

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
          submodules: recursive
          token: ${{ secrets.DOCKER_GH_AUTO_AUTH_KEY }}
    - uses: dtolnay/rust-toolchain@v1
      with:
        toolchain: stable
        components: rustfmt
    - run: cargo fmt --all -- --check
