name: Rust Lint

on:
  push:
    branches:
    - main
    - dev
    - feat/*
    - bugfix/*
    - rework/*
    - refactor/*
    - temp/*
  pull_request:
    branches:
    - main
    - dev
    - feat/*
    - bugfix/*
    - rework/*
    - refactor/*
    - temp/*

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
          submodules: recursive
          token: ${{ secrets.DOCKER_GH_AUTO_AUTH_KEY }}
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
