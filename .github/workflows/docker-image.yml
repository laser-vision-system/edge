name: Docker Image CI

on:
  push:
    branches: [ "main" , "feat/docker-automated-workflow" ]
  pull_request:
    branches: [ "main" ]


jobs:

  build:

    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
           submodules: true
           token: ${{ secrets.DOCKER_GH_AUTO_AUTH_KEY }}

      - uses: actions/checkout@v4.2.2
      - name: Setup submodule
        run: git submodule update --init --recursive

      - uses: actions/checkout@v4.2.2
      - name: configure docker builder
        run: docker buildx create --name container-builder --driver docker-container --bootstrap --use
#
#      - uses: actions/checkout@v4
#      - name: Build the Docker image
#        run: docker buildx build . --load --tag stable:$(date +%s) --platform linux/arm64

#      - name: Log in to the Container registry
#        uses: docker/login-action@v4
#        with:
#          registry: ${{ env.REGISTRY }}
#          username: ${{ github.actor }}
#          password: ${{ secrets.DOCKER_GH_AUTO_AUTH_KEY}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ghcr.io/cos40005-p12/stable:test
          builder: buildx
          platforms: linux/arm64
          cache-from: type=registry,ref=stable:buildcache
          cache-to: type=registry,ref=stable:buildcache,mode=max
