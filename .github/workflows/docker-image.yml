name: Docker Image Builder

run-name: ${{ github.actor }} is building and pushing a docker image for ${{ github.repository }}

on:
  workflow_dispatch:

  push:
    branches:
      - 'main'
      - 'dev'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  docker_build:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
      packages: write

    strategy:
      matrix:
        include:
          - os: ubuntu-22.04-arm
            arch: arm64
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
           submodules: recursive
           token: ${{ secrets.DOCKER_GH_AUTO_AUTH_KEY }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
              type=ref,event=branch
              type=raw,value=stable,enable={{is_default_branch}}
              type=schedule,pattern={{date 'YYYY-MM-DD'}}

      - uses: actions/checkout@v4.2.2
      - name: configure docker builder
        run: docker buildx create --name container-builder --driver docker-container --bootstrap --use

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          builder: container-builder
          platforms: linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
