name: Docker Image CI

run-name: ${{ github.actor }} is building and pushing docker image

on:
  push:
    branches: [ "main" , "feat/docker-automated-workflow" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  docker_build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04-arm
            arch: arm64
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
           submodules: recursive
           token: ${{ secrets.DOCKER_GH_AUTO_AUTH_KEY }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
              type=sha
              type=ref,event=branch
              type=semver,pattern={{version}}
              type=semver,pattern={{major}}.{{minor}}
              type=raw,value=latest,enable={{is_default_branch}}

      - uses: actions/checkout@v4.2.2
      - name: configure docker builder
        run: docker buildx create --name container-builder --driver docker-container --bootstrap --use

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

#      - uses: actions/checkout@v4
#      - name: Build the Docker image
#        run: docker buildx build --cache-from type=registry,ref=stable:buildcache --cache-to type=registry,ref=stable:buildcache,mode=max . --load --tag stable:$(date +%s) --platform linux/arm64

#      - name: Log in to the Container registry
#        uses: docker/login-action@v4
#        with:
#          registry: ${{ env.REGISTRY }}
#          username: ${{ github.actor }}
#          password: ${{ secrets.DOCKER_GH_AUTO_AUTH_KEY}}

#      - name: Set up Docker Buildx
#        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ghcr.io/cos40005-p12/edge/stable:test
          builder: container-builder
          platforms: linux/arm64
          cache-from: type=registry,ref=stable:buildcache
          cache-to: type=registry,ref=stable:buildcache,mode=max
          # github-token: '${{ secrets.DOCKER_GH_AUTO_AUTH_KEY }}'
