name: Docker Image CI

on:
  push:
    branches: [ "main" , "feat/docker-automated-workflow" ]
  pull_request:
    branches: [ "main" ]


jobs:

  build:

    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
           submodules: true
           token: ${{ secrets.DOCKER_GH_AUTO_AUTH_KEY }}

      - uses: actions/checkout@v4.2.2
      - name: Setup submodule
        run: git submodule update --init --recursive

      - uses: actions/checkout@v4.2.2
      - name: configure docker builder
        run: docker buildx create --name container-builder --driver docker-container --bootstrap --use
#
#      - uses: actions/checkout@v4
#      - name: Build the Docker image
#        run: docker buildx build . --load --tag stable:$(date +%s) --platform linux/arm64

      - name: Log in to the Container registry
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.DOCKER_GH_AUTO_AUTH_KEY}}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          builder: buildx
          platforms: linux/arm64
          cache-from: type=registry,ref=stable:buildcache
          cache-to: type=registry,ref=stable:buildcache,mode=max
