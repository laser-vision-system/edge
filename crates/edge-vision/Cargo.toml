[package]
name = "edge-vision"
edition.workspace = true
version.workspace = true

[features]
default = [
	"cnn-backend-flex",
	"cnn-backend-wgpu",
]

# == Burn backend selection ==
cnn-backend-flex = [
	"burn/flex",
	"dep:burn-flex",
]
cnn-backend-wgpu = [
	"burn/wgpu",
	"burn/fusion",
]
cnn-backend-cuda = [
	"burn/cuda",
	"burn/fusion",
]
cnn-backend-rocm = [
	"burn/rocm",
	"burn/fusion",
]
cnn-backend-cpu = [
	"burn/cpu",
	"burn/fusion",
]

[dependencies]

# Submodules
api.workspace = true

# Internal crates
edge-core.workspace = true

# External crates
burn = { version = "0.22", default-features = false, features = [
	"std",
] }
burn-flex = { version = "0.22", default-features = false, features = [
	"rayon",
	"simd",
], optional = true }
image.workspace = true
image-compare = "0.5"
lab = "0.11"
rayon = "1"
serde.workspace = true
thiserror.workspace = true

# Dependencies only needed for tests, examples, or benchmarks.
[dev-dependencies]
criterion = "0.8"
image.workspace = true

[[bench]]
name = "cnn_inference_flex"
path = "benches/cnn_inference/flex.rs"
required-features = ["cnn-backend-flex"]
harness = false

[[bench]]
name = "cnn_inference_wgpu"
path = "benches/cnn_inference/wgpu.rs"
required-features = ["cnn-backend-wgpu"]
harness = false

[[bench]]
name = "cnn_inference_cuda"
path = "benches/cnn_inference/cuda.rs"
required-features = ["cnn-backend-cuda"]
harness = false

[lints]
workspace = true
