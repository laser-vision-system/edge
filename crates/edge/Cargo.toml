[package]
name = "edge"
edition.workspace = true
version.workspace = true

[features]
default = [
	"cnn-backend-flex",
	"cnn-backend-wgpu",
]

# == Burn backend selection ==
cnn-backend-flex = [
	"edge-vision/cnn-backend-flex",
]
cnn-backend-wgpu = [
	"edge-vision/cnn-backend-wgpu",
]
cnn-backend-cuda = [
	"edge-vision/cnn-backend-cuda",
]
cnn-backend-rocm = [
	"edge-vision/cnn-backend-rocm",
]
cnn-backend-cpu = [
	"edge-vision/cnn-backend-cpu",
]

[dependencies]

# Submodules
api.workspace = true

# Internal crates
edge-cameras.workspace = true
edge-core.workspace = true
edge-client.workspace = true
edge-vision.workspace = true

# External crates
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true

[lints]
workspace = true
