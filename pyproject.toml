[project]
name = "edge"
version = "0.1.0"
description = "Edge Processing Tier μ-com project."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "numpy>=2.4.6",
    "opencv-python>=4.13.0.92",
    "pydantic-settings>=2.14.1",
]

[dependency-groups]
dev = [
    "pillow>=12.2.0",
    "pytest>=9.0.3",
]

# Trick to make the project into a local package.
[build-system]
requires = ["uv-build<1.0.0"]
build-backend = "uv_build"
